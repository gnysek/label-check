name: Android APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Jeśli w repo nie ma jeszcze folderu android/, wygeneruj go.
      - name: Generate Android platform files
        run: |
          if [ ! -d android ]; then
            flutter create . --platforms=android --project-name label_check --org pl.fableinside
          fi
          rm -f test/widget_test.dart

      - run: flutter pub get
      - name: Analyze
        run: |
          set -o pipefail
          flutter analyze 2>&1 | tee analyze.log

      - name: Test
        run: |
          set -o pipefail
          flutter test 2>&1 | tee test.log

      # Wersja debug do testów na telefonie. Build release wymaga reguł R8 dla ML Kit
      # (brakujące klasy modułów chińskiego/japońskiego/koreańskiego/devanagari).
      - name: Build APK
        run: |
          set -o pipefail
          flutter build apk --debug 2>&1 | tee build.log

      # Przy błędzie wypisz koniec logu jako adnotację (widoczną w podsumowaniu przebiegu).
      - name: Report build errors
        if: failure()
        run: |
          msg=$(cat analyze.log test.log build.log 2>/dev/null | grep -iE "error|exception|failed|wrong|could not|missing|requires|minSdk|•|expected|actual|\[E\]" | tail -n 30 | sed ':a;N;$!ba;s/\n/%0A/g' | cut -c1-6000)
          if [ -n "$msg" ]; then
            echo "::error title=Build log::${msg}"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: label-check-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
