name: Android APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Jeśli w repo nie ma jeszcze folderu android/, wygeneruj go.
      - name: Generate Android platform files
        run: |
          if [ ! -d android ]; then
            flutter create . --platforms=android --project-name label_check --org pl.fableinside
          fi
          rm -f test/widget_test.dart

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      # --no-shrink: R8 potrafi wywalić build przez brakujące klasy ML Kit
      # (moduły rozpoznawania chińskiego/japońskiego itd.), a do testów nie jest potrzebny.
      - name: Build APK
        run: |
          set -o pipefail
          flutter build apk --release --no-shrink 2>&1 | tee build.log

      # Przy błędzie wypisz koniec logu jako adnotację (widoczną w podsumowaniu przebiegu).
      - name: Report build errors
        if: failure()
        run: |
          if [ -f build.log ]; then
            msg=$(grep -iE "error|exception|failed|wrong|could not|missing|requires|minSdk" build.log | tail -n 25 | sed ':a;N;$!ba;s/\n/%0A/g' | cut -c1-6000)
            echo "::error title=Build log::${msg}"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: label-check-apk
          path: build/app/outputs/flutter-apk/app-release.apk
