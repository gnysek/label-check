name: Android APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Stały klucz podpisu, żeby kolejne wersje aktualizowały aplikację na
      # telefonie (bez odinstalowywania i utraty historii skanów).
      - name: Restore debug keystore
        id: keystore
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: debug-keystore-v1

      - name: Create debug keystore if missing
        if: steps.keystore.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.android
          keytool -genkeypair -keystore ~/.android/debug.keystore \
            -storepass android -keypass android -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      # Jeśli w repo nie ma jeszcze folderu android/, wygeneruj go.
      - name: Generate Android platform files
        run: |
          if [ ! -d android ]; then
            flutter create . --platforms=android --project-name label_check --org pl.fableinside
          fi
          rm -f test/widget_test.dart
          python3 tools/patch_android.py

      - run: flutter pub get

      - name: Analyze
        run: |
          set -o pipefail
          flutter analyze 2>&1 | tee analyze.log

      - name: Test
        run: |
          set -o pipefail
          flutter test 2>&1 | tee test.log

      # Jeden plik APK dla telefonów 64-bitowych (np. Samsung S24 FE).
      - name: Build APK
        run: |
          set -o pipefail
          flutter build apk --release --target-platform android-arm64 --build-number=${{ github.run_number }} 2>&1 | tee build.log

      # Diagnostyka: czy R8 nadal zaciemnia kod i jak wygląda konfiguracja gradle.
      - name: Report R8 status
        if: always()
        run: |
          if [ -f build/app/outputs/mapping/release/mapping.txt ]; then
            echo "::notice title=R8::mapping.txt istnieje, R8 nadal zaciemnia kod"
          else
            echo "::notice title=R8::brak mapping.txt, R8 wylaczony"
          fi
          grep -nE "minify|shrink|proguard" android/app/build.gradle* | tr '\n' ';' | sed 's/^/::notice title=gradle::/'

      # Przy błędzie wypisz koniec logu jako adnotację (widoczną w podsumowaniu przebiegu).
      - name: Report build errors
        if: failure()
        run: |
          msg=$( { grep -A12 "What went wrong" build.log; cat analyze.log test.log build.log | grep -iE "error|exception|failed|could not|missing|requires|minSdk|•|expected|actual|\[E\]" | tail -n 20; } 2>/dev/null | sed ':a;N;$!ba;s/\n/%0A/g' | cut -c1-6000)
          if [ -n "$msg" ]; then
            echo "::error title=Build log::${msg}"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: label-check-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      # Stały link do pobrania: Releases -> "latest" -> label-check.apk
      - name: Publish release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk label-check.apk
          gh release delete latest --yes --cleanup-tag --repo "${{ github.repository }}" || true
          gh release create latest label-check.apk \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "LabelCheck (najnowszy build)" \
            --notes "Build nr ${{ github.run_number }}, commit ${GITHUB_SHA::7}. Pobierz label-check.apk i zainstaluj na telefonie."
