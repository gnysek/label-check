name: label_check
description: Skanowanie list składników z etykiet (OCR) i sprawdzanie dodatków do żywności.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  google_mlkit_text_recognition: ^0.13.1
  image_picker: ^1.1.2
  shared_preferences: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/additives.json

# Ikona aplikacji (cytryna z lupą). Poważna wersja czeka w assets/icon/icon_serious.svg.
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#E8F5E9"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
